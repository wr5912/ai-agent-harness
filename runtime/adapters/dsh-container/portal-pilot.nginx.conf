worker_processes 1;
error_log /dev/null crit;
events { worker_connections 256; }

http {
    access_log off;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    map $http_cookie $dsh_cookie {
        default '';
        "~(?:^|;\s*)(dsh-auth-RXeEjZVaoV_DTX1lrkCodWeowiK67itMRlOVFbwxSMw=[^;]*)" $1;
    }

    server {
        listen 18120 ssl;
        ssl_certificate /etc/nginx/tls/portal.crt;
        ssl_certificate_key /etc/nginx/tls/portal.key;

        location / {
            proxy_pass http://127.0.0.1:13182;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Cookie $dsh_cookie;
            proxy_set_header Authorization '';
            proxy_read_timeout 3600s;
            proxy_buffering off;
        }
    }
}
