# 显式 --lan-access 才装载：开放 Web 监听与已认证浏览器的 Host 设置。
# DSH patch 会整体替换 config，故保留官方 webserver 行的其他配置。
- id: webserver
  config:
    host: 0.0.0.0
    port: !!js ctx.webStartup.port ?? 3080
    compression: gzip
    compressionLevel: 1
    compressionThresholdBytes: 1024
- insert:
    - id: web-remote-settings
      name: /opt/dsh-adapter/web-remote-settings/index.js
