schema_version: "1.0"
experiment_id: EXP-security-operations-expert-003
hypothesis_ref: ../hypothesis.md
baseline_ref: git:fe472a1fefa49be4a59ee5364eaa43c5538805e6
candidate_source: experiment:EXP-security-operations-expert-003
method:
  - 静态比较角色矩阵、Profile、Guard 与按深度计算的可见工具集合
  - 只读读取 sec-ops 和 inspection 的实时 tools/list
  - 在全新 DSH eval 实例和全新 Web Session 中交叉核对 Playwright 结果与完成轨迹
cases:
  - id: contract-static
    expected: 父 Agent 12 个工具、故障分析 15 个工具、响应规划零工具均与合同一致
  - id: contract-live
    expected: 全部允许 MCP 工具存在于对应实时目录
  - id: policy-boundary
    expected: request/header 仅含父 Agent 12 个工具，不调用策略工具，并说明只支持 prepare、status、result
  - id: inspection-boundary
    expected: 只调用 capabilities，不暴露或调用巡检运行工具
  - id: unavailable-routes
    expected: 威胁分析与知识库检索明确报告不可用，不猜测或调用工具
  - id: response-regression
    expected: 零工具响应规划 Gate 与结构化校验回归通过
side_effect_limit: 不执行策略 prepare/select/decide，不执行 inspection start/collect/finalize
