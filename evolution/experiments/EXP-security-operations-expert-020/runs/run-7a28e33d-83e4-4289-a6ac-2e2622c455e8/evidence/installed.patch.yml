- id: agent-default-model
  config:
    provider: voice-probe
    model: main
- id: session-title-llm
  disabled: true
- insert:
    - id: voice-summary-probe
      name: /opt/voice-probe/probe.mjs
    - id: voice-mode
      name: /opt/voice-plugin/lib/index.js
      config:
        allowLan: true
        ttsEngine: remote
        asrEngine: remote
        ttsStreamUrl: http://127.0.0.1:3386/voice-probe/tts
        ttsCancelUrl: http://127.0.0.1:3386/voice-probe/cancel/{generationId}
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-08-13.1
