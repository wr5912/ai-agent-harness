- insert:
    - id: mcp-session-manager
      name: file:///opt/dsh-managed/mcp-manager/index.mjs
      config:
        servers:
          - id: sec-ops
            serverName: sec-ops
            enabled: true
            urlEnv: SEC_OPS_MCP_URL
            tokenEnv: SEC_OPS_MCP_TOKEN
            tools:
              mode: all
              names: []
          - id: inspection
            serverName: inspection
            enabled: true
            urlEnv: INSPECTION_MCP_URL
            tokenEnv: INSPECTION_MCP_TOKEN
            tools:
              mode: all
              names: []
          - id: policy-configuration
            serverName: policy-configuration
            enabled: true
            urlEnv: POLICY_CONFIGURATION_MCP_URL
            tokenEnv: SEC_OPS_MCP_TOKEN
            tools:
              mode: all
              names: []
          - id: emergency-action
            serverName: emergency-action
            enabled: true
            urlEnv: EMERGENCY_ACTION_MCP_URL
            tokenEnv: EMERGENCY_ACTION_MCP_TOKEN
            tools:
              mode: all
              names: []
        groups: []
