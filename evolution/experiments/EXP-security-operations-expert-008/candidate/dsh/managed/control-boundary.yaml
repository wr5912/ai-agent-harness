schema_version: "1.0"
runtime: dsh-container-only
status: experiment-candidate
controls:
  - id: CTRL-DSH-001
    boundary: container-only-load
    enforcement: runtime-adapter
    failure_mode: stop
  - id: CTRL-DSH-002
    boundary: candidate-authoring-write-scope
    enforcement: bind-mount-plus-native-guard
    allowed: /work/harness/workspace
    denied:
      - /opt/dsh-managed
      - /opt/dsh-presets
      - /var/lib/dsh
      - repository-root
    authoring_live_behavior: experiment-only
    verification_activation: host-review-new-container-new-session
  - id: CTRL-DSH-003
    boundary: subject-read-only
    enforcement: bind-mount-plus-native-guard
    failure_mode: stop
  - id: CTRL-DSH-004
    boundary: role-tool-monotonic-decay
    enforcement: dsh-tool-filter-plus-native-guard
    maximum_delegation_depth: 1
  - id: CTRL-DSH-005
    boundary: mcp-service-authority
    enforcement: external-service
    required_checks:
      - authentication
      - tenant
      - object
      - parameter
      - quantity
      - audit
    repository_cannot_prove: true
  - id: CTRL-DSH-006
    boundary: response-planning
    enforcement: default-deny-native-guard
    trusted_gate_env: DSH_SEC_OPS_RESPONSE_PLANNING_ENABLED
    input_digest_env: DSH_SEC_OPS_RESPONSE_INPUT_SHA256
    output_schema_validation: native-post-execute-guard
    tool_access: none
  - id: CTRL-DSH-007
    boundary: exact-mcp-tool-contract
    enforcement: role-tool-matrix-plus-profile-plus-native-guard
    unknown_mcp: deny
  - id: CTRL-DSH-008
    boundary: policy-and-emergency-route-isolation
    enforcement: separate-skills-mcp-prefixes-and-native-guard
    root_only: true
    same_turn_cross_domain_calls: deny
    other_business_routes_after_policy_or_emergency: deny
  - id: CTRL-DSH-009
    boundary: trusted-confirmation-isolation
    enforcement: independent-runtime-plugins-plus-native-guard
    policy_exact_user_message: 执行
    emergency_exact_user_message: 确认执行
    matching_session_draft_required: true
    model_confirm_and_submit_tools: deny
  - id: CTRL-DSH-010
    boundary: optional-new-service-startup
    enforcement: source-contract-plus-profile-disabled-expression
    policy_mcp_url: POLICY_CONFIGURATION_MCP_URL
    emergency_mcp_url: EMERGENCY_ACTION_MCP_URL
    emergency_mcp_token: EMERGENCY_ACTION_MCP_TOKEN
    existing_sec_ops_and_inspection: required
