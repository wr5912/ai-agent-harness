schema_version: "1.0"
experiment_id: EXP-security-operations-expert-005
hypothesis_ref: ../hypothesis.md
baseline_ref: git:32ad39019c76db0f27088b8a239acf038166da18
candidate_source: experiment:EXP-security-operations-expert-005
method:
  - 静态校验角色矩阵、Profile、Guard、可见工具集合与三处巡检输出合同
  - 只读读取 sec-ops 和 inspection 的实时 tools/list
  - 在全新 DSH eval 实例和全新 Web Session 中交叉核对浏览器结果与执行轨迹
cases:
  - id: contract-static
    expected: 工具隔离合同与 Baseline 一致，主 Agent、巡检 Skill 和子 Agent persona 均声明同一用户可见输出顺序
  - id: contract-live
    expected: 全部允许 MCP 工具存在于对应实时目录
  - id: inspection-e2e
    expected: 同一句“执行一次常规巡检”按 start、collect、finalize 顺序完成并返回与本次运行一致的真实结果
  - id: user-facing-result
    expected: 标题先给状态或结论，真实报告链接紧接标题且早于摘要，随后是关键结果、建议和巡检概况，不出现内部证据标题或原始执行字段；数量、状态和时间逐项忠实于工具结果，不建立工具未声明的数值关系
  - id: role-isolation
    expected: 主 Agent 不直接看见 inspection MCP，巡检子 Agent 只看见四个 inspection 工具
  - id: response-regression
    expected: 零工具响应规划 Gate 与结构化校验回归通过
side_effect_limit: 前三轮依次发现结果归因、父子输出合同和计数关系措辞问题后，最多允许 inspection-e2e 创建并完成四次 scope=all 的 routine 即时巡检；不执行策略准备、选择、决策、计划任务或响应处置
