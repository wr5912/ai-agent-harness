schema_version: "1.0"
runtime: dsh-container-only
startup_policy: fail-closed
servers:
  - server_name: sec-ops
    transport: streamable-http
    url_env: SEC_OPS_MCP_URL
    bearer_token_env: SEC_OPS_MCP_TOKEN
    tool_prefix: mcp__sec-ops__
    purpose: SOC 只读取证、知识检索、故障分析状态机与策略准备控制面
  - server_name: inspection
    transport: streamable-http
    url_env: INSPECTION_MCP_URL
    bearer_token_env: INSPECTION_MCP_TOKEN
    tool_prefix: mcp__inspection__
    purpose: 实时巡检目录、提案、一次性执行与结果读取
  - server_name: threat-analysis
    transport: streamable-http
    url_env: THREAT_ANALYSIS_MCP_URL
    bearer_token_env: THREAT_ANALYSIS_MCP_TOKEN
    tool_prefix: mcp__threat-analysis__
    purpose: 威胁研判取证与唯一报告写回
secrets_policy:
  storage: runtime-injection-only
  repository_values_allowed: false
  user_text_is_authority: false
service_side_enforcement_required:
  - authentication
  - tenant-binding
  - object-authorization
  - parameter-schema
  - quantity-and-rate-limit
  - idempotency
  - approval
  - immutable-audit
