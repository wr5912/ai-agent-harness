# 叠加到 DSH 官方 web Profile。该文件只由容器内 DSH 加载。
# 全局工具使 tool-subagent 的 toolFilter 能对每个角色执行单调衰减；Preset
# 本身不注册模型工具，避免 scoped tool 绕过 response-planning 的 allow: []。

- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true

- id: tool-jobs
  disabled: true

- id: tool-fs
  disabled: false

- id: tool-fs-search
  disabled: false
  config:
    sampleOverCapGlobResults: false

- id: skill-filesystem
  disabled: false
  config:
    providerName: security-operations-workspace
    includeDefaultRoots: false
    customSkillDirs:
      - /work/harness/workspace/.agents/skills
    watch: !!js process.env.DSH_HARNESS_MODE === 'authoring'
    watchFollowSymlinks: false

- id: tool-skill
  disabled: false

- id: tool-web
  disabled: true

- id: tool-subagent-control
  disabled: true

- id: tool-subagent-list-agents
  disabled: true

- id: tool-subagent
  disabled: true

- id: tool-subagent-fork
  disabled: true

- id: workflow-worker-thread
  disabled: true

- id: tool-workflow
  disabled: true

- id: tool-ralph
  disabled: true

- id: agent-presets
  disabled: false
  config:
    default: security-operations-expert
    roots:
      - path: /opt/dsh-presets
        trust: system
    includeShippedRoot: false
    includeUserRoot: false

- insert:
    - id: security-operations-mcp-sec-ops
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: sec-ops
        transport: streamable-http
        url: !!js process.env.SEC_OPS_MCP_URL
        headers:
          Authorization: !!js '`Bearer ${process.env.SEC_OPS_MCP_TOKEN}`'
        failOnStartupError: true
        reconnect:
          enabled: false

    - id: security-operations-mcp-inspection
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: inspection
        transport: streamable-http
        url: !!js process.env.INSPECTION_MCP_URL
        headers:
          Authorization: !!js '`Bearer ${process.env.INSPECTION_MCP_TOKEN}`'
        failOnStartupError: true
        reconnect:
          enabled: false

    - id: security-operations-mcp-threat-analysis
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: threat-analysis
        transport: streamable-http
        url: !!js process.env.THREAT_ANALYSIS_MCP_URL
        headers:
          Authorization: !!js '`Bearer ${process.env.THREAT_ANALYSIS_MCP_TOKEN}`'
        failOnStartupError: true
        reconnect:
          enabled: false

    - id: security-operations-delegate-inspection
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: delegate_inspection
        enableRunInBackground: false
        backgroundMode: one-shot
        maxDepth: 1
        persona: >-
          你是巡检执行子 Agent。每次先读取实时巡检目录与 inputSchema；即时巡检只执行
          当前可用项并使用 Runtime 注入的幂等键；计划任务只形成无副作用提案。不得管理
          既有任务，不得使用目录外工具，不得把技术成功解释为业务合规。
        toolFilter:
          allow:
            - mcp__inspection__inspection_service__list_inspection_checks
            - mcp__inspection__inspection_service__preview_inspection_task
            - mcp__inspection__inspection_service__execute_inspection
            - mcp__inspection__inspection_service__list_inspection_tasks
            - mcp__inspection__inspection_service__get_inspection_task
            - mcp__inspection__inspection_service__get_inspection_run_progress
            - mcp__inspection__inspection_service__get_inspection_run_result
            - mcp__inspection__inspection_service__get_inspection_6e6414cd5e91
            - mcp__inspection__inspection_service__get_inspection_report
            - mcp__inspection__inspection_service__get_inspection_0cd3022ebf84

    - id: security-operations-delegate-fault-analysis
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: delegate_fault_analysis
        enableRunInBackground: false
        backgroundMode: one-shot
        maxDepth: 1
        persona: >-
          你是故障分析子 Agent，只分析不处置。先生成完整计划，再创建且只创建一个运行；
          只按冻结计划调用只读 SOC 工具并回填原始结果；随后单次收口，状态最多查询三次，
          最终只忠实返回 Runtime 的用户正文。禁止清理、Trace、重建运行和经验兜底。
        toolFilter:
          allow:
            - read
            - grep
            - glob
            - mcp__sec-ops__fault_diagnosis__fault_analysis_start
            - mcp__sec-ops__fault_diagnosis__fault_analysis_submit_tool_result
            - mcp__sec-ops__fault_diagnosis__fault_analysis_finalize
            - mcp__sec-ops__fault_diagnosis__fault_analysis_get_status
            - mcp__sec-ops__fault_diagnosis__fault_analysis_get_result
            - mcp__sec-ops__ai_soc_event__post_event_search
            - mcp__sec-ops__ai_soc_graph__get_graph_compliance_violations
            - mcp__sec-ops__ai_soc_graph__get_graph_coverage
            - mcp__sec-ops__ai_soc_graph__get_graph_flow_host_pair_ports
            - mcp__sec-ops__ai_soc_graph__get_graph_node_detail
            - mcp__sec-ops__ai_soc_graph__get_graph_path_query
            - mcp__sec-ops__ai_soc_graph__get_reachability_cross_signal
            - mcp__sec-ops__ai_soc_graph__get_reachability_path_by_ip
            - mcp__sec-ops__ai_soc_ingest__get_admin_ingest_devic_ad206f9cdb7c
            - mcp__sec-ops__ai_soc_master__detail
            - mcp__sec-ops__ai_soc_master__list_8
            - mcp__sec-ops__ai_soc_master__listbizbyasset
            - mcp__sec-ops__ai_soc_master__vulnerabilities

    - id: security-operations-delegate-response-planning
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: delegate_response_planning
        enableRunInBackground: false
        backgroundMode: one-shot
        maxDepth: 1
        persona: >-
          你是受信 Runtime 手动开启的单次响应规划 Agent。只消费本轮裸 JSON 冻结输入，
          只能从候选集合复用剧本、组合临时动作或返回人工复核。不得调用任何工具；输出
          必须是 response-plan-output/v1 裸 JSON，不得输出 Markdown、旁白或执行声明。
        toolFilter:
          allow: []

    - id: security-operations-delegate-threat-analysis
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: delegate_threat_analysis
        enableRunInBackground: false
        backgroundMode: one-shot
        maxDepth: 1
        persona: >-
          你是威胁研判子 Agent。围绕唯一 incidentId 同时完成事件真假与规则诊断，区分
          ERROR、EMPTY 与否定证据；所有主张引用稳定证据 ID。只允许将同一份版本化报告
          写回，不执行处置或规则变更；证据不足时必须保留 UNDETERMINED。
        toolFilter:
          allow:
            - mcp__threat-analysis__get_threat_event
            - mcp__threat-analysis__get_rule_assertion
            - mcp__threat-analysis__get_alerts
            - mcp__threat-analysis__resolve_entity
            - mcp__threat-analysis__get_field_domain
            - mcp__threat-analysis__get_entity_context
            - mcp__threat-analysis__check_feasibility
            - mcp__threat-analysis__query_baseline
            - mcp__threat-analysis__query_originator
            - mcp__threat-analysis__query_logs
            - mcp__threat-analysis__get_source_health
            - mcp__threat-analysis__validate_rule_format
            - mcp__threat-analysis__submit_report
