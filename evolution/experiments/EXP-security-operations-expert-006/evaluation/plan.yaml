schema_version: "1.0"
experiment_id: EXP-security-operations-expert-006
hypothesis_ref: ../hypothesis.md
baseline_ref: git:32ad39019c76db0f27088b8a239acf038166da18
candidate_source: experiment:EXP-security-operations-expert-006
method:
  - 运行启动器单元测试与来源解析，核对环境变量按声明生成且模板无业务硬编码
  - 启动全新 DSH eval 实例，在真实浏览器会话中核对默认模型与模型目录
  - 切换到本地 Qwen，发送最小连通性消息并交叉核对 Session 执行轨迹
cases:
  - id: adapter-env-passthrough
    expected: source 声明的模型和 MCP 环境变量各生成一次，通用 Compose 模板不包含具体业务变量名
  - id: model-catalog
    expected: 全新 Web Session 默认仍为 DeepSeek，模型选择器同时显示 local-qwen 的 Qwen3.8-27B
  - id: local-qwen-chat
    expected: 选择 Qwen3.8-27B 后发送“只回复：模型连通”，最终回答为“模型连通”
  - id: selected-route-trace
    expected: 对应 Session 的 request/header 记录 provider=local-qwen、model=Qwen3.8-27B
side_effect_limit: 只创建一个全新 eval 实例和一个最小连通性 Session；不执行安全巡检、策略变更、计划任务或响应处置
