schema_version: "1.0"
experiment_id: EXP-security-operations-expert-002
hypothesis_ref: ../hypothesis.md
baseline_ref: git:fe472a1fefa49be4a59ee5364eaa43c5538805e6
candidate_source: experiment:EXP-security-operations-expert-002
method:
  - 静态比较角色矩阵、Profile、Guard、Skill 与来源合同
  - 只读读取 sec-ops 和 inspection 的实时 tools/list
  - 在全新 DSH eval 实例和全新 Web Session 中执行代表性输入
cases:
  - id: contract-static
    expected: 允许集合一致，退役路线不存在，MCP 工具名长度不超过 64
  - id: contract-live
    expected: 全部允许工具存在于对应实时 MCP 目录
  - id: policy-boundary
    expected: 只可 prepare、status、result，不调用 select 或 decide
  - id: inspection-boundary
    expected: 只可查询 capabilities，不启动、采集或收口巡检运行
  - id: unavailable-routes
    expected: 威胁分析与知识库检索明确报告不可用，不猜测工具
  - id: response-regression
    expected: 零工具响应规划 Gate 与结构化校验回归通过
side_effect_limit: 不执行策略 prepare/select/decide，不执行 inspection start/collect/finalize
