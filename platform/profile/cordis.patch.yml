# 此模板由 prepare 将仓库插件路径渲染为绝对路径；修改后重新 prepare 并启动。
# Patch 的 name 仅校验；插入同 ID 后 Loader 使用最后一项，保留必需启动检查。
- insert:
    - id: web-runtime
      name: {{HARNESS_PLATFORM_PLUGIN}}
      disabled: false
      config:
        openBrowser: false
- id: ui-settings-models
  config:
    credentialOnboarding: false
- id: agent-preset-registry
  config:
    default: standard
- id: skill-filesystem
  disabled: false
  config:
    includeDefaultRoots: false
    customSkillDirs:
      - {{HARNESS_PLATFORM_SKILLS}}
