# 维护方式：本文件首次由 evaluation/tools/ingest_v02_spec.py 从源文档生成，此后由维护者维护；
# 重新生成须显式 --refresh，会覆盖维护者新增内容。字段含义：
#   goal 完成什么任务（取自关联需求的目标任务）；output 交付什么（取自任务的最终交付列）；
#   process 怎样做；stop_condition 达到什么状态就结束。
schema_version: "1.0"
tasks:
  # task-soc-rsp-01：形成可批准的处置方案
  - task_id: "task-soc-rsp-01"
    source_id: "TASK-SOC-RSP-01"
    related_req: "REQ-001"
    related_req_source: "REQ-SOC-RSP-01"
    goal: "从可核验的正式结果和真实动作/剧本目录形成可执行候选，不补造目标或动作"
    input_contract: "ResultRef、证据、目标对象、授权范围、发布的剧本/原子动作及执行点快照"
    process: "验证正式结果及版本/摘要；冻结目录和对象；优先匹配已发布剧本；按允许规则组合原子动作；核验依赖和参数；需保存时回读一致的草案"
    output: "候选方案、动作依赖、目标参数、影响、有效期、验证与补偿办法"
    stop_condition: "候选中的每个动作和参数都可回到目录及证据；必要信息不全时列出缺口；没有批准前执行调用数为 0"
  # task-soc-rsp-02：经有效批准执行最小范围阻断
  - task_id: "task-soc-rsp-02"
    source_id: "TASK-SOC-RSP-02"
    related_req: "REQ-002"
    related_req_source: "REQ-SOC-RSP-02"
    goal: "仅执行当前批准覆盖的具体目标、动作、范围与时限"
    input_contract: "候选 ID/摘要、认证批准事件、当前目标状态、SOC 执行能力、幂等键"
    process: "展示影响与回滚；校验主体、候选摘要和有效性；执行前重读状态；通过有权执行层一次提交；持久化执行账本"
    output: "批准状态、权威提交/受理回执、实际动作范围及待验证项"
    stop_condition: "未经批准或摘要变化时不能执行；批准后只提交批准的 /32；重复请求不产生重复副作用"
  # task-soc-rsp-03：联合动作逐节点跟踪
  - task_id: "task-soc-rsp-03"
    source_id: "TASK-SOC-RSP-03"
    related_req: "REQ-003"
    related_req_source: "REQ-SOC-RSP-03"
    goal: "按依赖完成可执行动作，真实报告部分成功、失败和补偿状态"
    input_contract: "多节点方案、各节点权限/风险/依赖、批准范围、各系统当前状态"
    process: "核验整本或逐项批准；按依赖执行；记录节点回执；分离可继续和必须停止的分支；列明补偿需求"
    output: "节点状态、整体状态、失败影响、可执行的补偿或新方案"
    stop_condition: "节点数量、目标和状态与真实账本逐项一致；后继动作遵守冻结依赖；失败节点不能被隐藏"
  # task-soc-rsp-04：验证安全效果与业务影响
  - task_id: "task-soc-rsp-04"
    source_id: "TASK-SOC-RSP-04"
    related_req: "REQ-004"
    related_req_source: "REQ-SOC-RSP-04"
    goal: "按事前固定的成功条件验证效果，而非只看接口返回"
    input_contract: "执行账本、成功标准、观察窗、可靠遥测/业务探测与覆盖信息"
    process: "等待适用技术终态；只读回读配置/控制状态；检查攻击与业务验证项；核实数据覆盖；输出有效、无效或证据不足"
    output: "技术执行状态、效果状态、支持证据、残余风险和下一步"
    stop_condition: "回执成功但恶意连接仍持续时效果不能为有效；遥测断流时返回证据不足/INCONCLUSIVE；全部事前标准有证据才可声明有效"
  # task-soc-rsp-05：失败恢复、重试与回滚
  - task_id: "task-soc-rsp-05"
    source_id: "TASK-SOC-RSP-05"
    related_req: "REQ-005"
    related_req_source: "REQ-SOC-RSP-05"
    goal: "先确认当前状态，再受控恢复；新方案和回滚使用当前授权"
    input_contract: "原执行账本、幂等键、最新状态、原方案、补偿能力、有效批准"
    process: "先读账本和执行系统；区分未提交、已受理、终态失败和未知；按冻结重试策略决定；变更目标或回滚形成新候选与批准；验证最终状态"
    output: "恢复轮次、重试/不重试理由、新审批、补偿/回滚结果"
    stop_condition: "丢失回执但已受理不得二次执行；重新规划后旧摘要批准失效；无回滚能力必须明确，不能声称已恢复"
  # task-soc-rsp-06：直接执行受控原子处置
  - task_id: "task-soc-rsp-06"
    source_id: "TASK-SOC-RSP-06"
    related_req: "REQ-006"
    related_req_source: "REQ-SOC-RSP-06"
    goal: "将明确动作请求变成可授权、可确认、可验证的单动作或有限组合任务，不强制先完成一次无关研判"
    input_contract: "已认证主体；目标稳定标识；动作及必要参数；请求/工单/预授权依据；当前状态；真实动作目录；适用批准"
    process: "识别直接请求；核验目标与依据；只补齐必需参数；构造当前候选；按动作风险确认；有能力时通过唯一责任方提交；回读并验证"
    output: "受控处置请求、影响与确认、执行回执、目标状态及未完成项"
    stop_condition: "有能力且授权完整时精确完成指定动作；缺目标、缺批准或不支持时保持真实状态且说明原因；输入纠正后重新绑定当前候选"
  # task-soc-rsp-07：处置及剧本运行查询、暂停、继续、终止与撤销
  - task_id: "task-soc-rsp-07"
    source_id: "TASK-SOC-RSP-07"
    related_req: "REQ-007"
    related_req_source: "REQ-SOC-RSP-07"
    goal: "保持同一实例与节点状态；区分查询、暂停、继续、停止后续和补偿回滚"
    input_contract: "发布剧本及版本或现有任务 ID；当前节点账本；控制能力；目标/参数；当前授权及适用确认；补偿定义"
    process: "唯一定位剧本/实例；核验发布与当前状态；按允许迁移请求控制；已完成节点不重复执行；需要回滚转当前补偿方案；查询独立只读"
    output: "运行或控制回执、节点状态、已发生副作用、未执行节点及补偿需求"
    stop_condition: "控制结果与权威节点账本一致；重复控制不重复副作用；停止后不再启动可阻止的后继节点；在途无法取消及不可逆项明确披露"
  # task-soc-ins-01：立即执行常规全面巡检
  - task_id: "task-soc-ins-01"
    source_id: "TASK-SOC-INS-01"
    related_req: "REQ-008"
    related_req_source: "REQ-SOC-INS-01"
    goal: "根据当前真实检查目录，在授权范围完成巡检并说明覆盖"
    input_contract: "认证主体、当前检查目录、资产范围、时间/新鲜度规则"
    process: "无专项限定时采用 routine/all 且省略 capabilities；固定目录与范围；调用现有巡检入口；推进服务端允许的收集与完成步骤"
    output: "本轮检查结果、资产×检查项覆盖、异常摘要和报告"
    stop_condition: "实际计划的默认字段正确；范围与授权集合一致；所有应检单元有结果或明确缺口"
  # task-soc-ins-02：按设备类别或安全能力专项巡检
  - task_id: "task-soc-ins-02"
    source_id: "TASK-SOC-INS-02"
    related_req: "REQ-009"
    related_req_source: "REQ-SOC-INS-02"
    goal: "准确匹配真实设备/能力目录，返回可比较的专项结果"
    input_contract: "类别/能力线索、目录、授权设备集合、适用检查项"
    process: "查询真实目录并消歧；按照现有契约限制目录查询次数；冻结筛选条件；批量运行并保留无数据项"
    output: "专项范围、差异、异常和优先级"
    stop_condition: "调用使用真实目录 ID；只覆盖选定对象；未知类别应澄清而非映射到相似能力"
  # task-soc-ins-03：判断单台设备当前健康
  - task_id: "task-soc-ins-03"
    source_id: "TASK-SOC-INS-03"
    related_req: "REQ-010"
    related_req_source: "REQ-SOC-INS-03"
    goal: "区分设备实际状态、管理探测、采集/API 故障和未知"
    input_contract: "设备稳定标识、权威状态、采集时间、适用探测回执"
    process: "唯一解析对象；读取权威状态与探测证据；比较时效；发生冲突时明确冲突和缺口；需要根因时交接故障任务"
    output: "当前健康判断、各层状态、时间和必要的排障入口"
    stop_condition: "设备在线但探测失败的预置场景不得输出设备已离线；权威离线证据才能支持对应结论"
  # task-soc-ins-04：周期巡检及异常推送
  - task_id: "task-soc-ins-04"
    source_id: "TASK-SOC-INS-04"
    related_req: "REQ-011"
    related_req_source: "REQ-SOC-INS-04"
    goal: "调度面按固定范围触发巡检，去重推送真实异常并保留运行关联"
    input_contract: "调度配置/时区/授权、检查目录、去重规则、通知目标"
    process: "管理面验证配置；调度触发唯一运行；执行只读检查；按冻结异常键和恢复规则合并；发送授权通知；必要时生成低风险工单"
    output: "各次运行、异常增量、通知/工单回执和关联报告"
    stop_condition: "同一调度触发不重复创建运行；相同未变化异常按规则去重；权限撤回后不再运行；无调度能力明确缺口"
  # task-soc-ins-05：忠实输出报告并支持继续排障
  - task_id: "task-soc-ins-05"
    source_id: "TASK-SOC-INS-05"
    related_req: "REQ-012"
    related_req_source: "REQ-SOC-INS-05"
    goal: "返回本轮权威报告，保持 run_id、状态与结果血缘"
    input_contract: "运行 ID、服务端下一步指令、正式报告、异常项稳定标识"
    process: "仅按服务端允许动作推进；保留成功/失败数据；完成条件满足后获取正式结果；按当前契约原样输出 user_response_markdown；交接选定异常"
    output: "真实摘要/报告链接、未知与失败列表、传给故障任务的 ResultRef"
    stop_condition: "报告与本轮 ID 一致、可授权访问；正文与权威值一致；异常索引绑定稳定对象；接口失败不变成全正常"
  # task-soc-ins-06：查询已有运行状态、资产检查项与巡检结果
  - task_id: "task-soc-ins-06"
    source_id: "TASK-SOC-INS-06"
    related_req: "REQ-013"
    related_req_source: "REQ-SOC-INS-06"
    goal: "以授权只读查询回答指定对象与时间的现有事实，不强制启动完整巡检"
    input_contract: "对象/类别/筛选条件；时间和数据新鲜度要求；状态、资产及结果数据源；访问权限"
    process: "识别“看已有”与“重新检查”；解析筛选及授权集合；查询必要数据；标明时间/覆盖；需重新检查时复用相应巡检任务；历史入口缺失如实说明"
    output: "匹配列表、状态及采集时间、数据缺口、已有报告引用；需要实时重查时说明"
    stop_condition: "范围、筛选、汇总和报告引用与权威快照相符；明确要求不新建时运行数不增加；缺时效证据不编造当前状态"
  # task-soc-flt-01：业务访问链路排障
  - task_id: "task-soc-flt-01"
    source_id: "TASK-SOC-FLT-01"
    related_req: "REQ-014"
    related_req_source: "REQ-SOC-FLT-01"
    goal: "保持源/目的/协议/端口和路径，定位有证据支持的故障点"
    input_contract: "症状、源/目的、协议/端口、发生时间、授权范围、相关网络和业务证据"
    process: "确认症状和最小访问元组；匹配领域与方向；生成可执行只读计划；按准备就绪的依赖收集；核对路由/控制/服务证据；形成支持与冲突关系"
    output: "事实、候选根因、排除项、缺口与下一步"
    stop_condition: "访问元组保持；仅凭单一超时不能确定策略根因；充分证据的预置场景必须识别真实故障而非一律未知"
  # task-soc-flt-02：设备运行与关联异常排障
  - task_id: "task-soc-flt-02"
    source_id: "TASK-SOC-FLT-02"
    related_req: "REQ-015"
    related_req_source: "REQ-SOC-FLT-02"
    goal: "区分设备本身、管理面、采集面及对象关联问题"
    input_contract: "设备唯一标识、运行/管理/HA/日志、关联/纳管信息及时间"
    process: "唯一解析设备；检查运行、主备、资源及采集；对资产映射异常核对来源与同步；逐项验证假设"
    output: "候选故障点、影响范围、证据和检查建议"
    stop_condition: "状态来源和时刻明确；设备在线/管理不可达的预置场景不误判设备断电；关联错误不冒充设备故障"
  # task-soc-flt-03：数据、安全能力及级联链路排障
  - task_id: "task-soc-flt-03"
    source_id: "TASK-SOC-FLT-03"
    related_req: "REQ-016"
    related_req_source: "REQ-SOC-FLT-03"
    goal: "定位采集、传输、解析、检测、事件生成或同步展示的实际断点"
    input_contract: "各阶段计数/时间/错误、规则状态、同步任务、覆盖与基线"
    process: "固定时间窗和链路；逐段比对输入输出/水位/错误；检查规则与允许名单；核验级联任务和跨节点一致性"
    output: "链路断点、影响范围、可靠性边界和恢复建议"
    stop_condition: "金标准断点可被识别；明确零事件、零命中、未覆盖、链路失败；保留部分失败证据"
  # task-soc-flt-04：变更归因与候选恢复方案
  - task_id: "task-soc-flt-04"
    source_id: "TASK-SOC-FLT-04"
    related_req: "REQ-017"
    related_req_source: "REQ-SOC-FLT-04"
    goal: "核对变更差异、实际命中和替代原因，给出受控修复/回滚候选"
    input_contract: "变更前后版本、时间线、当前策略、访问事实和业务验证项"
    process: "回读前后配置；定位可能影响该访问的差异；检查反例和同时变化因素；证据充分时确认关联；将修复意图交接策略/响应任务"
    output: "有条件的归因、最小修复/回滚候选、验证项"
    stop_condition: "无命中或路径证据时保留候选而非确诊；方案不含未经支持的扩大权限；本任务无写副作用"
  # task-soc-flt-05：承接正式结果并完成八域诊断
  - task_id: "task-soc-flt-05"
    source_id: "TASK-SOC-FLT-05"
    related_req: "REQ-018"
    related_req_source: "REQ-SOC-FLT-05"
    goal: "保持结果血缘，执行受支持诊断并输出权威结果；不支持域和缺证据受控停止"
    input_contract: "正式 ResultRef/异常 ID，领域方向，准备就绪计划，证据和运行预算"
    process: "核验上游来源；生成轻量 planning_intent；运行时形成确定计划；仅调用 ready 工具；原样汇入成功/失败/空结果；完成后按契约获取正式报告"
    output: "正式诊断结果、支持/冲突/缺失证据、置信说明、报告引用"
    stop_condition: "八域及42方向有明确映射；原始证据和对象血缘一致；缺失不被当反证；finalize/状态查询次数符合版本契约"
  # task-soc-flt-06：围绕故障单独查询证据与执行受控检查
  - task_id: "task-soc-flt-06"
    source_id: "TASK-SOC-FLT-06"
    related_req: "REQ-019"
    related_req_source: "REQ-SOC-FLT-06"
    goal: "完成指定范围的只读取证或低扰动验证，保留原始证据和对故障的有限解释"
    input_contract: "故障上下文或明确对象；数据类型/检查项；时间；授权；目录与准备就绪的只读计划"
    process: "确定取证而非处置意图；由受支持只读入口或计划执行；保持源目的与时间；分别记录空、失败和命中；按证据解释，不强制形成完整确诊报告"
    output: "查询事实、原始证据引用、范围与缺口、必要的下一步；明确要求时再形成诊断"
    stop_condition: "返回的数据和引用符合请求范围，写副作用为零；要求进一步诊断时引用原证据而非丢失上下文；工具缺失不虚构结果"
  # task-soc-pol-01：新增策略与最小范围候选
  - task_id: "task-soc-pol-01"
    source_id: "TASK-SOC-POL-01"
    related_req: "REQ-020"
    related_req_source: "REQ-SOC-POL-01"
    goal: "准确解析意图、消歧对象并形成符合需求的候选"
    input_contract: "源/目的、协议/端口、动作、有效期、设备/域上下文、真实对象与策略目录"
    process: "解析并规范化；校验字段和冲突表达；查询权威对象；零匹配说明缺口，多匹配让用户选择；分析当前策略与最小差异"
    output: "结构化意图、候选对象、变更影响与待补字段"
    stop_condition: "完整输入语义保持；缺字段不生成可执行假草案；目标对象来自当前权威查询；候选满足最小范围"
  # task-soc-pol-02：修改现有策略并保持唯一草案
  - task_id: "task-soc-pol-02"
    source_id: "TASK-SOC-POL-02"
    related_req: "REQ-021"
    related_req_source: "REQ-SOC-POL-02"
    goal: "回读当前版本、展示精确差异，形成唯一可追溯草案"
    input_contract: "策略稳定 ID、当前版本、拟修改字段、候选/任务摘要、幂等键"
    process: "解析真实策略；重读当前态；比对差异；校验候选摘要/选择和并发版本；保存后回读完整草案"
    output: "前后差异、唯一 DRAFT、保存回读结果"
    stop_condition: "同键同载荷复用，同键异载荷冲突；选择过期候选失败；修改只影响已确认字段"
  # task-soc-pol-03：策略删除
  - task_id: "task-soc-pol-03"
    source_id: "TASK-SOC-POL-03"
    related_req: "REQ-022"
    related_req_source: "REQ-SOC-POL-03"
    goal: "明确删除对象和影响，按当前授权完成可审计变更"
    input_contract: "真实策略 ID、当前状态、依赖/影响、删除草案、有效批准"
    process: "重读目标与影响；展示删除与停用区别；形成删除草案；经新批准后交执行责任方；验证当前态"
    output: "删除候选、审批和实际结果"
    stop_condition: "对象唯一、删除语义明确；未批准不删除；已不存在时返回真实状态，不伪造一次新删除成功"
  # task-soc-pol-04：策略启停与历史恢复
  - task_id: "task-soc-pol-04"
    source_id: "TASK-SOC-POL-04"
    related_req: "REQ-023"
    related_req_source: "REQ-SOC-POL-04"
    goal: "具备对应能力时形成启停方案；历史恢复另需明确恢复点；缺少本动作必需条件时受控说明"
    input_contract: "当前对象、启停语义或历史版本、差异、真实接口能力、批准"
    process: "检查能力是否支持；区分现存对象启用/停用与历史恢复；查询当前及适用历史状态；明确状态切换或恢复点与差异；形成新批准；执行后重新验证"
    output: "启停/恢复候选及状态，或明确能力缺口"
    stop_condition: "所需接口缺失，或历史恢复缺少可核验恢复点时，说明能力或信息缺口；现存对象启停不强求历史版本；有能力时准确切换启用态或恢复选定版本，不新建、不误删除、不选择其他历史点"
  # task-soc-pol-05：基于正式诊断推荐最小调整
  - task_id: "task-soc-pol-05"
    source_id: "TASK-SOC-POL-05"
    related_req: "REQ-024"
    related_req_source: "REQ-SOC-POL-05"
    goal: "从正式结果推导最小候选，并定义效果验证与回滚"
    input_contract: "正式结果、受影响访问元组、证据、当前策略/路径、业务验证项"
    process: "核验 ResultRef 和对象血缘；回读当前态；生成最小差异；校验冲突/已有覆盖；明确验证与恢复；进入正常草案链"
    output: "调整原因、候选差异、业务影响、验证和回滚计划"
    stop_condition: "候选对应正式证据中的访问元组；已有等效覆盖不盲目重复新增；冲突说明不靠文本猜测"
  # task-soc-pol-06：批准、执行、恢复查询与真实状态
  - task_id: "task-soc-pol-06"
    source_id: "TASK-SOC-POL-06"
    related_req: "REQ-025"
    related_req_source: "REQ-SOC-POL-06"
    goal: "绑定当前会话/主体/摘要，遵守能力门禁并如实返回执行状态"
    input_contract: "唯一草案、认证批准、当前状态、SOC 能力、幂等执行记录、验证输入"
    process: "按 V2 prepare/status/select/result 建议链处理；批准前再次 status；decide(APPROVE) 校验；只在执行能力可用时提交；状态未知查询账本；低风险验证业务效果"
    output: "审批、执行/能力缺口状态、权威回执、验证和审计信息"
    stop_condition: "伪批准/旧摘要被阻断；能力不可用时无写副作用且明确缺口；有效能力沙箱必须证明真实状态与效果，不能仅凭 API 成功"
  # task-soc-pol-07：查询当前策略、名单及命中状态
  - task_id: "task-soc-pol-07"
    source_id: "TASK-SOC-POL-07"
    related_req: "REQ-026"
    related_req_source: "REQ-SOC-POL-07"
    goal: "返回指定执行点和版本的真实策略/名单事实，分离配置、下发、命中与效果"
    input_contract: "设备/策略/名单稳定标识或可消歧线索；授权；时间；当前配置及命中数据"
    process: "消歧规则类型与执行点；只读回读当前对象与适用命中记录；按请求过滤；没有效果证据则只说明已知配置/命中"
    output: "规则与状态、版本/时效、来源、命中范围及未知项"
    stop_condition: "返回对象、版本、状态和统计口径正确；无写调用；缺失数据明确披露，不用经验补齐"
  # task-soc-pol-08：ACL、WAF 与黑白名单等策略子类型的受控配置
  - task_id: "task-soc-pol-08"
    source_id: "TASK-SOC-POL-08"
    related_req: "REQ-027"
    related_req_source: "REQ-SOC-POL-08"
    goal: "在保持类型特有匹配语义的前提下形成精确变更，并复用审批、执行和验证链"
    input_contract: "规则类型；真实执行点；对象/成员/匹配条件；动作；有效期与范围；当前版本；能力与批准"
    process: "按类型查询真实对象模型；检查特有字段；固定当前版本与匹配集合；生成差异；复用当前批准和唯一执行责任方；逐点回读并验证"
    output: "类型化候选和前后差异、审批、逐设备结果、业务验证及恢复点"
    stop_condition: "可用分支只改变已确认类型和范围；不支持类型明确缺口；跨设备部分失败真实呈现；恢复使用该类型支持的方式"
  # task-soc-pol-09：策略与规则的只读分析、测试和调整建议
  - task_id: "task-soc-pol-09"
    source_id: "TASK-SOC-POL-09"
    related_req: "REQ-028"
    related_req_source: "REQ-SOC-POL-09"
    goal: "依据完整的适用规则和匹配语义做可复核分析，给出证据与最小调整建议，测试不改变生产态"
    input_contract: "规则及顺序/语义；作用域和当前版本；正反例流量；适用基线；可用确定性分析或仿真能力"
    process: "冻结规则类型与作用语义；运行适用分析/测试；以实际匹配集合和反例核实结论；缺依赖标明未完成；需要修改时另走候选审批"
    output: "问题类型、涉及规则、重叠/覆盖关系、反例或命中解释、未检查项及候选建议"
    stop_condition: "结论可从冻结规则及测试输入复算，正确区分冲突/冗余/覆盖关系；只读写次数为零；未覆盖基线不输出整体合规"
  # task-soc-qa-01：安全概念和术语解释
  - task_id: "task-soc-qa-01"
    source_id: "TASK-SOC-QA-01"
    related_req: "REQ-029"
    related_req_source: "REQ-SOC-QA-01"
    goal: "以中文准确解释受信知识、适用边界和常见混淆"
    input_contract: "问题、授权知识集合、知识快照、必要上下文"
    process: "理解问题；检索受信知识；核对支持片段；解释术语与区别；对无来源的关键事实保留意见"
    output: "答案、概念边界、来源及必要的不确定性"
    stop_condition: "必需概念要点正确且不混淆；关键断言有适用来源；不能用流畅空话替代回答"
  # task-soc-qa-02：产品型号和版本能力问答
  - task_id: "task-soc-qa-02"
    source_id: "TASK-SOC-QA-02"
    related_req: "REQ-030"
    related_req_source: "REQ-SOC-QA-02"
    goal: "依据确切型号、版本及许可条件回答理论能力，分离在网状态"
    input_contract: "产品/型号/版本线索、产品手册、版本说明、必要许可条件"
    process: "消歧型号版本；检索对应文档；比较版本差异；说明许可或启用条件；当前态问题转授权实时查询而非臆测"
    output: "支持/不支持/有条件/无法确认、适用版本、引用"
    stop_condition: "版本不明且答案随版本变化时必须澄清或分版本说明；理论支持不能声明当前生效"
  # task-soc-qa-03：内部制度、SOP 和操作帮助
  - task_id: "task-soc-qa-03"
    source_id: "TASK-SOC-QA-03"
    related_req: "REQ-031"
    related_req_source: "REQ-SOC-QA-03"
    goal: "按当前可检索且对该用户有权的制度/手册给出适用操作说明"
    input_contract: "用户权限、制度生效信息、组织/系统范围、版本化 SOP"
    process: "检索授权制度；筛选有效版本与范围；解释流程和权限前置；指出冲突或缺失；需要动作时由用户另起明确受控任务"
    output: "步骤、前置条件、责任角色、来源版本和适用范围"
    stop_condition: "只依据当前适用制度；旧版不能冒充现行；描述“谁可以批准”不等于给当前用户批准权"
  # task-soc-qa-04：检索范围与敏感信息边界
  - task_id: "task-soc-qa-04"
    source_id: "TASK-SOC-QA-04"
    related_req: "REQ-032"
    related_req_source: "REQ-SOC-QA-04"
    goal: "只使用授权知识，外部文档文本不能改变工具权限或数据范围"
    input_contract: "认证用户/检索凭据权限、文档/知识库范围、接口契约、问题"
    process: "鉴权并冻结允许集合；按实际 API 契约处理全部请求范围；检索过滤/拒绝；生成时只使用授权片段；检查引用权限"
    output: "授权范围内答案或受控拒绝，不泄露无权内容"
    stop_condition: "当前 KMP 全部范围请求含未授权库时按其契约整体拒绝；正文指令不能扩大范围；输出无敏感凭据"
  # task-soc-qa-05：引用、冲突、缺知识和失败处理
  - task_id: "task-soc-qa-05"
    source_id: "TASK-SOC-QA-05"
    related_req: "REQ-033"
    related_req_source: "REQ-SOC-QA-05"
    goal: "明确可知范围；每个关键断言有支持引用，失败和无知识不同"
    input_contract: "检索状态、可访问片段、版本/生效/废止信息、来源定位"
    process: "区分成功零命中与失败；验证引用定位和支持关系；应用明确的有效性规则；同等权威冲突不能自行挑选；答案说明未覆盖项"
    output: "带证据答案，或冲突说明、澄清、未知/检索失败及下一步"
    stop_condition: "零命中如实无依据，失败如实检索不可用；所有输出引用真实可访问并支持对应断言；冲突未解决时不得给确定唯一结论"
  # task-soc-qa-06：多轮问答与动作边界
  - task_id: "task-soc-qa-06"
    source_id: "TASK-SOC-QA-06"
    related_req: "REQ-034"
    related_req_source: "REQ-SOC-QA-06"
    goal: "保留明确上下文但不越权，纠正后使用新对象/版本；操作请求转独立审批任务"
    input_contract: "当前问题、会话引用、已确认对象/版本、用户纠正和授权"
    process: "消解“它/刚才”；检查上下文变化；重新检索对应版本；识别说明与执行意图；需要动作时交接并重新验证对象和权限"
    output: "连贯答案、更新后的引用，或明确的任务交接"
    stop_condition: "更正型号后不能混用旧版能力；“按这个做”不能绕过策略/响应的当前批准；问答任务内生产写次数为 0"
